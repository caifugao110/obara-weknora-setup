name: Docs Site

# 文档（仓库内任意 *.md）发生变更时，自动重建文档站并发布到 GitHub Pages。
on:
  push:
    branches: [main, master]
    paths:
      - '**/*.md'
      - 'LICENSE'
      - 'scripts/docs-site/build-docs-site.py'
      - 'scripts/docs-site/docs-site-template.html'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'LICENSE'
      - 'scripts/docs-site/build-docs-site.py'
      - 'scripts/docs-site/docs-site-template.html'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:
  schedule:
    # 兜底：每周一 03:17（UTC）全量重建一次，防止极端情况下漏构建
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建文档站
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整历史以读取每篇文档的最后更新时间

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装构建依赖
        run: python -m pip install --upgrade pip markdown Pygments

      - name: 生成静态站点
        run: python scripts/docs-site/build-docs-site.py --output site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          TZ: Asia/Shanghai

      - name: 校验产物
        run: |
          test -f site/index.html || (echo "::error::未生成 site/index.html" && exit 1)
          echo "产物大小：$(du -h site/index.html | cut -f1)"

      # Pull Request 只做构建校验，上传产物供预览
      - name: 上传预览产物（PR）
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-preview
          path: site

      # 推送到主分支时，发布为 Pages 产物
      - name: 配置 Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 发布到 GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 部署
        id: deploy
        uses: actions/deploy-pages@v4
